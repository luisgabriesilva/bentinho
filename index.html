<!doctype html>

    <meta charset="UTF-8" />

    <title>Chá de Panela</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #001660c4;
        min-height: 100vh;
        padding: 30px 15px;
        color: #333;
      }

      .container {
        max-width: 700px;
        margin: auto;
      }

      header {
        text-align: center;
        margin-bottom: 30px;
      }

      header h1 {
        font-size: 34px;
        color: #ffffff;
        margin-bottom: 10px;
      }

      header p {
        color: #777;
        font-size: 16px;
      }

      .lista {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .item {
        background: white;
        border-radius: 15px;
        padding: 18px;

        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;

        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);

        transition: 0.3s;
      }

      .item:hover {
        transform: translateY(-2px);
      }

      .informacoes {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .icone {
        font-size: 30px;
      }

      .informacoes h3 {
        font-size: 17px;
        margin-bottom: 5px;
      }

      .informacoes p {
        color: #999;
        font-size: 13px;
      }

      .botao {
        border: none;
        background: #001660c4;
        color: white;

        padding: 10px 16px;
        border-radius: 10px;

        font-size: 14px;
        font-weight: bold;

        cursor: pointer;

        transition: 0.2s;
      }

      .botao:hover {
        background: ##001660c4;
        transform: scale(1.05);
      }

      /* ITEM ESCOLHIDO */

      .item.escolhido {
        background: #f0f0f0;
        opacity: 0.7;
      }

      .item.escolhido h3 {
        text-decoration: line-through;
        color: #888;
      }

      .item.escolhido .botao {
        background: #6ab47b;
        cursor: default;
      }

      .item.escolhido .botao:hover {
        transform: none;
      }

      .rodape {
        text-align: center;
        margin-top: 30px;
        color: #999;
        font-size: 14px;
      }

      @media (max-width: 600px) {
        body {
          padding: 20px 12px;
        }

        header h1 {
          font-size: 28px;
        }

        .item {
          padding: 15px;
        }

        .icone {
          font-size: 25px;
        }

        .informacoes h3 {
          font-size: 15px;
        }

        .botao {
          padding: 9px 12px;
          font-size: 12px;
        }
      }
    </style>
  </head>

      let escolhidos = JSON.parse(localStorage.getItem("chaPanela")) || [];

      function mostrarItens() {
        const lista = document.getElementById("lista");

        lista.innerHTML = "";

        itens.forEach((item) => {
          const escolhido = escolhidos.includes(item.id);

          const elemento = document.createElement("div");

          elemento.className = "item";

          if (escolhido) {
            elemento.classList.add("escolhido");
          }

          elemento.innerHTML = `

                    <div class="informacoes">

                        <span class="icone">
                            ${item.icone}
                        </span>

                        <div>

                            <h3>
                                ${item.nome}
                            </h3>

                            <p>
                                ${item.descricao}
                            </p>

                        </div>

                    </div>


                    <button
                        class="botao"
                        onclick="finalizar(${item.id})"
                        ${escolhido ? "disabled" : ""}
                    >

                        ${escolhido ? "✓ Escolhido" : "Finalizar"}

                    </button>

                `;

          lista.appendChild(elemento);
        });
      }

      function finalizar(id) {
        if (escolhidos.includes(id)) {
          return;
        }

        escolhidos.push(id);

        localStorage.setItem("chaPanela", JSON.stringify(escolhidos));

        mostrarItens();
      }

      mostrarItens();
    </script>
