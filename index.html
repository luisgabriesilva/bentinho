    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #001660c4;
        min-height: 100vh;
        padding: 30px 15px;
        color: #333;
      }

      .container {
        max-width: 700px;
        margin: auto;
      }

      header {
        text-align: center;
        margin-bottom: 30px;
      }

      header h1 {
        font-size: 34px;
        color: #ffffff;
        margin-bottom: 10px;
      }

      header p {
        color: #777;
        font-size: 16px;
      }

      .lista {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .item {
        background: white;
        border-radius: 15px;
        padding: 18px;

        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;

        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);

        transition: 0.3s;
      }

      .item:hover {
        transform: translateY(-2px);
      }

      .informacoes {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .icone {
        font-size: 30px;
      }

      .informacoes h3 {
        font-size: 17px;
        margin-bottom: 5px;
      }

      .informacoes p {
        color: #999;
        font-size: 13px;
      }

      .botao {
        border: none;
        background: #001660c4;
        color: white;

        padding: 10px 16px;
        border-radius: 10px;

        font-size: 14px;
        font-weight: bold;

        cursor: pointer;

        transition: 0.2s;
      }

      .botao:hover {
        background: #001660c4;
        transform: scale(1.05);
      }

      /* ITEM ESCOLHIDO */

      .item.escolhido {
        background: #f0f0f0;
        opacity: 0.7;
      }

      .item.escolhido h3 {
        text-decoration: line-through;
        color: #888;
      }

      .item.escolhido .botao {
        background: #6ab47b;
        cursor: default;
      }

      .item.escolhido .botao:hover {
        transform: none;
      }

      .rodape {
        text-align: center;
        margin-top: 30px;
        color: #999;
        font-size: 14px;
      }

      @media (max-width: 600px) {
        body {
          padding: 20px 12px;
        }

        header h1 {
          font-size: 28px;
        }

        .item {
          padding: 15px;
        }

        .icone {
          font-size: 25px;
        }

        .informacoes h3 {
          font-size: 15px;
        }

        .botao {
          padding: 9px 12px;
          font-size: 12px;
        }
      }
    </style>
  </head>

      // Configuração do aplicativo Firebase do site.
      const firebaseConfig = {
        apiKey: "AIzaSyCmpsi6o-eGYq35Y_Q6G0nWPD1ioDAS93M",
        authDomain: "cha-de-panela-b7588.firebaseapp.com",
        databaseURL: "https://cha-de-panela-b7588-default-rtdb.firebaseio.com",
        projectId: "cha-de-panela-b7588",
        storageBucket: "cha-de-panela-b7588.firebasestorage.app",
        messagingSenderId: "474301287617",
        appId: "1:474301287617:web:3ec602e31dc44df6ae5840",
        measurementId: "G-B082GWVG0P",
      };

      let escolhidos = [];
      let bancoPronto = false;

      function mostrarItens() {
        const lista = document.getElementById("lista");
        lista.innerHTML = "";

        itens.forEach((item) => {
          const escolhido = escolhidos.includes(item.id);
          const elemento = document.createElement("div");
          elemento.className = "item";
          if (escolhido) elemento.classList.add("escolhido");

          elemento.innerHTML = `
            <div class="informacoes">
              <span class="icone">${item.icone}</span>
              <div>
                <h3>${item.nome}</h3>
                <p>${item.descricao}</p>
              </div>
            </div>
            <button class="botao" onclick="finalizar(${item.id})" ${escolhido || !bancoPronto ? "disabled" : ""}>
              ${escolhido ? "✓ Escolhido" : bancoPronto ? "Escolher presente" : "Conectando..."}
            </button>
          `;
          lista.appendChild(elemento);
        });
      }

      // Firebase compat é usado para manter o restante do site simples, sem build ou npm.
      try {
        if (
          firebaseConfig.apiKey === "COLE_SUA_API_KEY" ||
          firebaseConfig.databaseURL.includes("SEU-PROJETO")
        ) {
          throw new Error("Configure as credenciais do Firebase no código.");
        }
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const escolhidosRef = db.ref("escolhidos");

        // Atualização em tempo real: todos os visitantes recebem as mesmas marcações.
        escolhidosRef.on(
          "value",
          (snapshot) => {
            const dados = snapshot.val() || {};
            escolhidos = Object.keys(dados)
              .filter((id) => dados[id] === true)
              .map(Number);
            bancoPronto = true;
            mostrarItens();
          },
          (erro) => {
            console.error("Erro ao ler a lista:", erro);
            document.getElementById("lista").innerHTML =
              "<p style='color:white;text-align:center'>Não foi possível carregar a lista. Confira a configuração e as regras do Firebase.</p>";
          },
        );

        async function marcarPresente(id) {
          const ref = db.ref("escolhidos/" + id);
          // A transação evita que duas pessoas reservem o mesmo item ao mesmo tempo.
          const resultado = await ref.transaction((atual) => {
            if (atual === true) return; // aborta se alguém já marcou
            return true;
          });
          if (!resultado.committed) {
            alert("Esse presente acabou de ser escolhido por outra pessoa.");
          }
        }

        window.finalizar = async function (id) {
          if (!bancoPronto || escolhidos.includes(id)) return;
          try {
            await marcarPresente(id);
          } catch (erro) {
            console.error("Erro ao marcar presente:", erro);
            alert("Não foi possível marcar o presente. Tente novamente.");
          }
        };
      } catch (erro) {
        console.error(erro);
        document.getElementById("lista").innerHTML =
          "<p style='background:white;padding:16px;border-radius:12px'>Para ativar a lista compartilhada, falta configurar o Firebase neste arquivo. Veja as instruções enviadas junto com ele.</p>";
      }

      mostrarItens();
    </script>
